<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Corda v0.25 — Inter / Sample Spacing</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

/* ==================================================
   ITR DESIGN SETTINGS — edit this block for styling
   ================================================== */
:root {
    --itr-background: #111111;
    --itr-text: #eeeeee;
    --itr-text-muted: #aaaaaa;
    --itr-text-faint: #777777;
    --itr-panel-line: rgba(255,255,255,0.18);
    --itr-control-border: rgba(255,255,255,0.28);
    --itr-control-background: rgba(255,255,255,0.05);
    --itr-control-text: #bbbbbb;
    --itr-active: #ffffff;
    --itr-active-ui: #ffffff;
    --itr-active-soft: rgba(255,255,255,0.12);
    --itr-bow-glow: rgba(255,255,255,0.35);

    --itr-font: "Inter", Arial, sans-serif;
    --itr-ui-top: 26px;
    --itr-ui-left: 28px;
    --itr-ui-width: 220px;
    --itr-ui-line-height: 1.65;
    --itr-label-size: 11px;
    --itr-section-size: 10px;
    --itr-bow-width: 2px;
    --itr-bow-point-size: 8px;
}


html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: var(--itr-background);
    color: var(--itr-text);

    font-family: var(--itr-font);
}

#info {
    position: absolute;
    top: var(--itr-ui-top);
    left: var(--itr-ui-left);

    z-index: 10;
    pointer-events: none;

    line-height: var(--itr-ui-line-height);
    font-size: 12px;
    font-weight: 400;
}

#status {
    font-variant-numeric: tabular-nums;
    margin-top: 14px;
    color: var(--itr-text-muted);
}


#modelRow{
    display:flex;
    align-items:baseline;
    gap:12px;
}
#replaceModel{
    appearance:none;
    border:0;
    padding:0;
    margin:0;
    background:none;
    color:var(--itr-text-muted);
    font:inherit;
    font-size:inherit;
    text-decoration:underline;
    text-underline-offset:2px;
    cursor:pointer;
}
#replaceModel:hover{
    color:var(--itr-text);
}

#dropMessage {
    cursor: pointer;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: min(420px, calc(100vw - 64px));
    height: 112px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255,255,255,0.28);
    color: var(--itr-text-muted);

    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.04em;
    line-height: 1;

    pointer-events: auto;
    z-index: 20;
    user-select: none;
}

canvas {
    display: block;
}


#spaceControls{
    margin-top:18px;
    padding-top:0;
    border-top:0;
    width:var(--itr-ui-width);
}

.spaceTitle{
    font-size:var(--itr-section-size);
    letter-spacing:0.14em;
    opacity:0.65;
    margin-bottom:9px;
}

.spaceRow{
    display:grid;
    grid-template-columns:58px 1fr 34px;
    align-items:center;
    gap:8px;
    margin:7px 0;
    font-size:var(--itr-label-size);
}

.spaceRow input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:1px;
    margin:0;
    background:rgba(255,255,255,0.35);
    outline:none;
    cursor:pointer;
}

.spaceRow input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:1px;
    height:9px;
    border:0;
    border-radius:0;
    background:#ffffff;
    cursor:pointer;
}

.spaceRow input[type="range"]::-moz-range-thumb{
    width:1px;
    height:9px;
    border:0;
    border-radius:0;
    background:#ffffff;
    cursor:pointer;
}

.spaceRow input[type="range"]::-moz-range-track{
    height:1px;
    border:0;
    background:rgba(255,255,255,0.35);
}

.spaceValue{
    text-align:right;
    font-variant-numeric:tabular-nums;
    opacity:0.8;
}


/* v0.6.2: UI controls must receive pointer input before the 3D canvas. */
#info{
    pointer-events:auto;
    z-index:20;
}

#spaceControls,
#spaceControls *{
    pointer-events:auto;
}

#spaceControls input[type="range"]{
    cursor:pointer;
    touch-action:none;
}


#performanceControls{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid var(--itr-panel-line);
    width:var(--itr-ui-width);
    pointer-events:auto;
}
.modeToggle{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}
.modeButton{
    appearance:none;
    border:1px solid var(--itr-control-border);
    background:var(--itr-control-background);
    color:var(--itr-control-text);
    padding:6px 8px;
    font:inherit;
    font-size:var(--itr-label-size);
    cursor:pointer;
}
.modeButton.active{
    border-color:var(--itr-active-ui);
    color:var(--itr-text);
    background:var(--itr-active-soft);
}
#bowActivePoint{
 position:fixed;width:var(--itr-bow-point-size);height:var(--itr-bow-point-size);border-radius:50%;
 background:var(--itr-active);transform:translate(-50%,-50%);
 pointer-events:none;z-index:31;display:none;
}
#bow{
    position:fixed;
    width:120px;
    height:var(--itr-bow-width);
    background:var(--itr-active-ui);
    transform:translate(-50%,-50%);
    transform-origin:center;
    pointer-events:none;
    z-index:15;
    display:none;
    box-shadow:0 0 5px var(--itr-bow-glow);
}

</style>
</head>


<body>

<div id="info">

<strong>CORDA v0.25</strong><br>

Hover / move: Pizz / Strum<br>
1st click: Bow start<br>
2nd click: Bow end → Arco<br>
Click in Arco: Remove Bow → Pizz<br>
Right drag: Orbit<br>
Wheel: Zoom

<div id="status">
<div id="modelRow"><span id="fileStatus">Model: N/A</span><button id="replaceModel" type="button" hidden>Replace</button></div>
<div id="lengthStatus">Length: —</div>
<div id="frequencyStatus">Frequency: —</div>
</div>

<div id="spaceControls">
    <div class="spaceTitle">SPACE</div>

    <div class="spaceRow">
        <span>Reverb</span>
        <input
            id="reverbSlider"
            type="range"
            min="0"
            max="50"
            value="20"
            step="1"
        >
        <span
            id="reverbValue"
            class="spaceValue"
        >20%</span>
    </div>

    <div class="spaceRow">
        <span>Delay</span>
        <input
            id="delaySlider"
            type="range"
            min="0"
            max="50"
            value="13"
            step="1"
        >
        <span
            id="delayValue"
            class="spaceValue"
        >13%</span>
    </div>
</div>

</div>


<div id="bow"></div>
<div id="bowActivePoint"></div>

<div id="dropMessage" role="button" tabindex="0" aria-label="Load GLB or GLTF model">
Drop .glb / .gltf here<br>or click to select a file
</div>
<input id="modelFileInput" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" hidden>


<script type="module" src="./main.js"></script>

</body>
</html>
